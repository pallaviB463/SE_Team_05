{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-card">
  <h2>Log in to APAS</h2>
  {% if error %}<p class="error" role="alert" id="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('web.login_page') }}" novalidate>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required
           {% if error %}aria-describedby="login-error"{% endif %}>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" style="width:100%;">Sign in &rarr;</button>
  </form>
</div>
{% endblock %}
